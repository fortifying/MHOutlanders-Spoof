name: Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK build-tools
        run: |
          BUILD_TOOLS_VERSION="35.0.0"
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"

          if [ ! -d "${BUILD_TOOLS_DIR}" ]; then
            echo "[*] ${BUILD_TOOLS_VERSION} not found pre-installed, installing via sdkmanager..."
            export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
            yes | sdkmanager --install "build-tools;${BUILD_TOOLS_VERSION}"
          fi

          if [ -d "${BUILD_TOOLS_DIR}" ]; then
            echo "${BUILD_TOOLS_DIR}" >> $GITHUB_PATH
          else
            LATEST_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
            echo "[*] Falling back to build-tools: ${LATEST_DIR}"
            echo "${LATEST_DIR}" >> $GITHUB_PATH
          fi

      - name: Make build script executable
        run: chmod +x scripts/build.sh

      - name: Build APK
        run: bash scripts/build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHOutlanders-Spoof
          path: build/MHOutlanders-Spoof.apk
          if-no-files-found: error

